<h2>Add Book</h2>
<form method="post">
    {% csrf_token %}
    Title: <input type="text" name="title"><br>
    Author: <input type="text" name="author"><br>
    Price: <input type="number" name="price"><br>
    Edition: <input type="number" name="edition"><br>
    <button type="submit">Add Book</button>
</form>
