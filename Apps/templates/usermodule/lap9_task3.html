<style>
    table {
        width: 75%;
        border-collapse: collapse;
        margin: 20px auto;
    }

    table, th, td {
        border: 1px solid black;
    }

    th, td {
        padding: 15px;
        text-align: left;
    }

    th {
        background-color: #c25a5a;
        color: white;
    }

    h1 {
        text-align: center;
        font-family: 'Franklin Gothic Medium';
        color: olivedrab;
    }
</style>

<h1>Departments and Student ID</h1>
<table>
    <tr>
        <th>Department Name</th>
        <th>Student ID</th>
    </tr>
    {% for dept in department_id %}
    <tr>
        <td>{{ dept.name }}</td>
        <td>{{ dept.studentlap9_oldest }}</td>
    </tr>
    {% endfor %}
</table>
