<!DOCTYPE html>
<html>
<head>
    <title>Student2 List</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        table { width: 80%; border-collapse: collapse; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1);}
        th, td { padding: 12px 15px; text-align: center; border-bottom: 1px solid #ddd;}
        th { background-color: #4CAF50; color: white; }
        tr:hover { background-color: #f5f5f5; }
        a { text-decoration: none; color: #4CAF50; margin: 0 5px; }
        a:hover { text-decoration: underline; }
        .add-button { display: block; width: fit-content; margin: 20px auto; padding: 10px 20px; background-color: #4CAF50; color: white; text-decoration: none; border-radius: 5px;}
        .add-button:hover { background-color: #45a049; }
    </style>
</head>
<body>

<h1 style="text-align:center;">Student2 List</h1>

<a href="{% url 'student2_add' %}" class="add-button">Add New Student</a>

<table>
    <thead>
        <tr>
            <th>#</th>
            <th>Name</th>
            <th>Age</th>
            <th>Addresses</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
    {% for s in students %}
        <tr>
            <td>{{ s.id }}</td>
            <td>{{ s.name }}</td>
            <td>{{ s.age }}</td>
            <td>
                {% for addr in s.addresses.all %}
                    {{ addr.city }}{% if not forloop.last %}, {% endif %}
                {% endfor %}
            </td>
            <td>
                <a href="{% url 'student2_edit' s.id %}">Edit</a> |
                <a href="{% url 'student2_delete' s.id %}">Delete</a>
            </td>
        </tr>
    {% empty %}
        <tr>
            <td colspan="5">No students available.</td>
        </tr>
    {% endfor %}
    </tbody>
</table>

</body>
</html>
